[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ml-failure-lab"
version = "0.1.0"
description = "Small, runnable ML failures with corrections and tests for the actual requirement."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "sricharanreddycheruku" }]
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.6,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
ml-failure-lab = "ml_failure_lab.cli:main"

[project.urls]
Repository = "https://github.com/sricharanreddycheruku/ml-failure-lab"
Issues = "https://github.com/sricharanreddycheruku/ml-failure-lab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_failure_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
